# gen-mihomo-config values example
# 公开参考示例：请替换订阅 URL、密码等占位内容，不是可直接联网的默认配置。
# 启用注释中的可选示例时，请替换对应的空块/列表，不要重复同名键。

port: 7890
web_port: 9090
tun_device: utun-mihomo
dns_split_cn_foreign: false
web_secret: change-me-before-use

# simple 或 detailed
group_mode: simple

# 最终 Mihomo 配置覆盖：块递归合并，列表整体替换，优先级最高。
# 这些配置块及块内的显式字段会按填写顺序显示在生成文件的最前面。
# 使用 Mihomo 原生字段名；不启用覆盖时保留 {}。
config_overrides: {}
# config_overrides:
#   ipv6: true
#   dns:
#     ipv6: true
#   experimental:
#     dialer-ip4p-convert: true  # 需要核心支持对应实验功能

# 默认使用 Yacd-meta-gh-pages；可覆盖
external_ui: ./Yacd-meta-gh-pages/
external_ui_url: >-
  https://github.com/MetaCubeX/yacd/archive/gh-pages.zip

# 远程订阅。prefix 会加到订阅节点名称前面。
# 多条 name 相同的订阅会汇总所有来源；完整条目完全相同时只保留一份。
# 内部自动分配唯一 provider 名称和 HTTP 缓存路径，不按节点名去重。
proxy_providers:
  - name: main
    prefix: Main
    url: https://example.com/main-subscription.yaml
  # 同名来源示例：取消注释后，两条 main 订阅的节点都会进入策略组。
  # - name: main
  #   prefix: Main
  #   url: https://example.com/another-main-subscription.yaml
  - name: backup
    prefix: Backup
    url: https://example.com/backup-subscription.yaml
    path: ./proxy_providers/backup.yaml
    interval: 7200
    # proxy: proxy  # 默认 DIRECT；有需要时显式改为代理组

# 把所选订阅中的节点加入已有组或汇总到新组。填写订阅 name，同名来源一起加入。
# Web 页面可直接勾选；空映射保持默认行为。
group_providers: {}
# group_providers:
#   my_proxy: [main]
#   combined: [main, backup]  # 新建 select 组，并加入 final

# 手写节点默认只进入 my_proxy，不加入地区组；可通过 failover.backup_nodes 显式用于保底
local_proxies:
  - name: local_ss
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: aes-128-gcm
    password: change-me

# 可选自动故障转移：机场优先，自建节点保底。{} 不启用，不改默认选择。
# 启用后需在客户端把 proxy 选为 failover；空组/全部失败不会自动直连。
# 请先将 local_ss 替换为真正可用的自建节点；所选订阅的健康检查会同步覆盖。
failover: {}
# failover:
#   primary: [main, backup]       # 优先机场订阅，同名来源全部纳入
#   backup_nodes: [local_ss]      # 自建裸节点：local_proxies 中的名称，不是组名
#   # backup: [self_hosted]       # 或自建节点订阅：需先在 proxy_providers 定义，与 primary 不重叠
#   url: https://www.google.com/generate_204
#   expected_status: 204
#   interval: 30                 # 秒；节点多时可调为 60–120
#   timeout: 5000                # 毫秒

# WG 内网快速配置：自动生成独立分组和规则；final 可手动选择，默认不走 WG。
# 将下面的注释示例取消注释，并替换 wireguard: []；密钥占位符必须换成真实值。
wireguard: []
# wireguard:
#   - name: office  # 生成 wg_office 分组与 wg_office_node 节点
#     server: wg.example.com
#     port: 51820
#     ip: 10.7.0.2  # 客户端隧道地址，不带 CIDR 前缀
#     # ipv6: fd00:7::2
#     private-key: REPLACE_WITH_CLIENT_PRIVATE_KEY
#     public-key: REPLACE_WITH_SERVER_PUBLIC_KEY
#     # pre-shared-key: REPLACE_WITH_PRESHARED_KEY
#     # ip-version: ipv6-prefer
#     # mtu: 1420
#     # persistent-keepalive: 25
#     allowed-ips:  # 每个网段使用 CIDR 格式
#       - 10.7.0.0/24
#       - 192.168.50.0/24
#     # routes: [192.168.50.0/24]  # 可选：仅分流 allowed-ips 中的较窄网段
#     # domains: [office.internal]
#     # routes: []  # 配合非空 domains，仅按域名分流
# 内网模式不允许生成 /0 分流；仅配置节点不会自动设置内网 DNS。
# 另见 config-values-wireguard.example.yaml。

# 自定义策略组会被加入主分类组（注意避免循环引用）
local_proxy_groups:
  - name: work
    type: select
    proxies:
      - proxy
      - eu
      - us
      - DIRECT

# 简单规则列表：只写匹配器字段，生成器会自动追加策略。
# proxy_rules / direct_rules 直接进入 proxy / DIRECT。
proxy_rules:
  - DOMAIN-SUFFIX,example-proxy.test

direct_rules:
  - DOMAIN-SUFFIX,example-direct.test

# 其他内置组按组名追加：proxy、ai、chat、media、apple 等；telegram 仅 detailed 模式可用。
group_rules:
  chat:
    - DOMAIN-SUFFIX,example-telegram.test
  media:
    - DOMAIN-SUFFIX,example-media.test

# 自定义规则集。HTTP provider 默认使用 DIRECT 下载。
custom_rule_providers:
  - name: work_rules
    behavior: classical
    format: text
    url: https://example.com/work.list
    path: ./rule_providers/work.list
    policy: work
    rule_options:
      - no-resolve

# 规则按顺序插入到最终 rules 的最前面
local_rules:
  - DOMAIN-SUFFIX,example.com,work

# 地区组默认选择隐藏的 *_auto 子组，也可手动选择本地区订阅节点。
# auto 只测速订阅节点，不引用父组；无匹配节点时 REJECT，不回退 my_proxy / DIRECT。
url_test:
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false  # 持续健康检查；也用于订阅默认的 health-check

# basic 默认只保留 18 条常用例外；compat 恢复 89 条历史兼容列表。
fake_ip_filter_mode: basic
# 向所选列表追加，不会改变这些域名的流量分流策略。
fake_ip_filter:
  - +.example.com
  - stun.example.net
