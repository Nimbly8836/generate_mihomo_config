---
name: Build Web Docker image

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1  # v1
        with:
          ruby-version: "4.0"

      - name: Test generator and form
        run: |
          gem install minitest --version '~> 5.25' --no-document
          ruby -Itest test/generate_mihomo_config_test.rb
          node --test test/web_form_test.cjs

      - name: Set up Docker Buildx
        # v3
        uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build native image for smoke testing
        # v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: mihomo-web:smoke
          cache-from: type=gha,scope=web-native
          cache-to: type=gha,mode=max,scope=web-native

      - name: Smoke test Compose and Web APIs
        env:
          MIHOMO_WEB_IMAGE: mihomo-web:smoke
        run: |
          cleanup() {
            docker compose -p mihomo-ci logs --no-color
            docker compose -p mihomo-ci down
          }
          trap cleanup EXIT
          docker compose -p mihomo-ci up -d --wait --wait-timeout 60
          ruby test/web_smoke_test.rb
          docker compose -p mihomo-ci exec -T web sh -c \
            'test "$(id -u)" = 10001 && test ! -w /app'

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        # v5
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Set up QEMU for multi-platform publishing
        if: github.event_name != 'pull_request'
        # v3
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 image
        if: github.event_name != 'pull_request'
        # v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-multi
          cache-to: type=gha,mode=max,scope=web-multi
