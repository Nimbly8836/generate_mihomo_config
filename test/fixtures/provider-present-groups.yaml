---
hk:
  type: select
  use: &remote_provider
    - remote_provider
  filter: "(?i)(🇭🇰|香港|港(?![澳台])|(^|[^a-z])\
    (hk|hkg|hong[ _-]?kong)([^a-z]|$))"
  exclude-filter: "(?i)(澳門|澳门|macao|macau)"
  proxies:
    - hk_auto
    - my_proxy
tw:
  type: select
  use: *remote_provider
  filter: "(?i)(🇹🇼|台湾|(^|[^a-z])\
    (tw|twn|tpe|taipei|taiwan)([^a-z]|$))"
  exclude-filter: "(?i)(hong[ _-]?kong|hk|hkg|macau|macao)"
  proxies:
    - tw_auto
    - my_proxy
jp:
  type: select
  use: *remote_provider
  filter: "(?i)(🇯🇵|日本|(^|[^a-z])\
    (jp|jpn|japan|tokyo|osaka)([^a-z]|$))"
  proxies:
    - jp_auto
    - my_proxy
us:
  type: select
  use: *remote_provider
  filter: "(?i)(🇺🇸|美国|(^|[^a-z])\
    (us|usa|united[ _-]?states|america)([^a-z]|$)|\
    los[ _-]?angeles|san[ _-]?jose|silicon[ _-]?valley|\
    new[ _-]?york|seattle|chicago)"
  exclude-filter: "(?i)(australia|au|aus)"
  proxies:
    - us_auto
    - my_proxy
sg:
  type: select
  use: *remote_provider
  filter: "(?i)(🇸🇬|新加坡|狮城|(^|[^a-z])\
    (sg|sgp|singapore)([^a-z]|$))"
  proxies:
    - sg_auto
    - my_proxy
others:
  type: select
  use: *remote_provider
  filter: ".+"
  exclude-filter: "(?i)(🇭🇰|🇹🇼|🇯🇵|🇺🇸|🇸🇬|🇨🇳|\
    香港|台湾|日本|美国|新加坡|(^|[^a-z])\
    (hk|hkg|hong[ _-]?kong|tw|twn|tpe|taipei|taiwan|\
    jp|jpn|japan|us|usa|united[ _-]?states|america|\
    sg|sgp|singapore)([^a-z]|$))"
  proxies:
    - others_auto
    - my_proxy
all_nodes:
  type: select
  use: *remote_provider
  proxies:
    - my_proxy
auto_select:
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  proxies:
    - my_proxy
    - DIRECT
  use:
    - remote_provider
