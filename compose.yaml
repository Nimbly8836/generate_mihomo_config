---
services:
  web:
    image: ${MIHOMO_WEB_IMAGE:-ghcr.io/nimbly8836/generate_mihomo_config:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-4567}:4567"
    environment:
      HOST: 0.0.0.0
      PORT: "4567"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
